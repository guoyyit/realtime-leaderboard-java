# 服务端口（0 表示随机端口）
server.port=0

# ==================== 排行榜配置 ====================

# 本地持久化数据目录（WAL + 快照）
leaderboard.data-dir=./leaderboard-data

# 是否对 WAL 执行 fsync（更强持久性，更低性能；默认关闭）
leaderboard.wal-fsync=false

# 每写入多少条 WAL 后触发一次全量快照
leaderboard.snapshot-every=1000

# 每用户每秒允许的提交数（令牌桶填充速率）
leaderboard.rate-limit.per-user-per-second=10

# 每用户令牌桶容量（突发上限）
leaderboard.rate-limit.capacity=20

# 允许的最低分数（含）
leaderboard.score-min=0

# 允许的最高分数（含）
leaderboard.score-max=1000000000
